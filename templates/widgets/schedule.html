<div class="bg-panel border border-[#2a2a2a] rounded-lg overflow-hidden h-full flex flex-col">
  <div class="flex items-center px-4 py-3 border-b border-[#2a2a2a] flex-shrink-0">
    <span class="font-sans text-sm font-bold text-[#e8e8e8]">Daily routine</span>
  </div>
  <div id="schedule-list" class="p-4 flex-1 overflow-y-auto">
    <p class="font-sans text-sm text-[#aaaaaa]">Loading…</p>
  </div>
</div>
<script>
(function() {
  async function load() {
    const res  = await fetch('/api/schedule/due');
    const data = await res.json();
    const list = document.getElementById('schedule-list');
    if (!data.ok) { list.innerHTML = `<p class="font-sans text-sm text-[#aaaaaa]">Error loading schedule.</p>`; return; }
    if (data.suspended) {
      list.innerHTML = `
        <div class="flex items-center gap-3 py-3 text-[#aaaaaa]">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="flex-shrink-0 opacity-60">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9v6m-4.5 0V9M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
          </svg>
          <p class="font-sans text-sm">Schedules paused</p>
        </div>`;
      return;
    }
    if (!data.items.length) { list.innerHTML = `<p class="font-sans text-sm text-[#aaaaaa]">Nothing due right now.</p>`; return; }
    list.innerHTML = data.items.map(item => `
      <div class="flex items-center gap-3 py-3 border-b border-[#333333] last:border-0" id="sched-${item.id}">
        <input type="checkbox" onchange="widgetCompleteSchedule(${item.id})"
               class="accent-amber-500 w-8 h-8 flex-shrink-0 cursor-pointer">
        <div class="flex-1 min-w-0">
          <p class="font-sans text-lg font-semibold text-[#E8E6E3]">${item.name}</p>
          <p class="font-sans text-sm text-[#aaaaaa]">${item.scheduled_time}</p>
        </div>
      </div>
    `).join('');
  }

  window.widgetCompleteSchedule = async function(id) {
    await fetch(`/api/schedule/${id}/complete`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}
    });
    load();
  };

  document.addEventListener('DOMContentLoaded', load);
  setInterval(load, 60000);
})();
</script>
